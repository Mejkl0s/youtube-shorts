name: Windows desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', 'backend/**', 'src/**', 'scripts/desktop*', 'scripts/build_desktop.py', 'requirements.txt', 'package*.json', '.github/workflows/windows-desktop.yml']
permissions:
  contents: read
concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RANK_PUBLISHER: ${{ vars.RANK_PUBLISHER }}
      RANK_UPDATE_URL: ${{ vars.RANK_UPDATE_URL }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt -r desktop/requirements-build.txt
          npm ci
          npm --prefix desktop ci
      - name: Verify and stage FFmpeg and Node
        run: |
          python scripts/build_desktop.py --prepare-only
          Add-Content -Path $env:GITHUB_PATH -Value "$pwd\build\desktop-tools\bin"
      - name: Install verified OCR dependency for regression fixtures
        run: |
          try {
          $rankOcrInstaller = Join-Path $env:RUNNER_TEMP 'rank-tesseract-5.4.0.exe'
          $rankOcrDirectory = Join-Path $env:RUNNER_TEMP 'rank-test-ocr'
          Invoke-WebRequest -Uri 'https://github.com/UB-Mannheim/tesseract/releases/download/v5.4.0.20240606/tesseract-ocr-w64-setup-5.4.0.20240606.exe' -OutFile $rankOcrInstaller
          # microsoft/winget-pkgs: UB-Mannheim.TesseractOCR 5.4.0.20240606
          if ((Get-FileHash -LiteralPath $rankOcrInstaller -Algorithm SHA256).Hash -ne 'C885FFF6998E0608BA4BB8AB51436E1C6775C2BAFC2559A19B423E18678B60C9') { throw 'OCR installer integrity check failed.' }
          $rankOcrResult = Start-Process -FilePath $rankOcrInstaller -ArgumentList @('/S', "/D=$rankOcrDirectory") -Wait -PassThru
          if ($rankOcrResult.ExitCode -ne 0) { throw "OCR fixture dependency installation failed with exit code $($rankOcrResult.ExitCode)." }
          $rankOcrBinary = Join-Path $rankOcrDirectory 'tesseract.exe'
          if (-not (Test-Path -LiteralPath $rankOcrBinary)) {
            $rankOcrBinary = Join-Path $env:ProgramFiles 'Tesseract-OCR\tesseract.exe'
          }
          if (-not (Test-Path -LiteralPath $rankOcrBinary)) { throw 'Verified OCR installer did not create its executable.' }
          & $rankOcrBinary --version
          if ($LASTEXITCODE -ne 0) { throw 'OCR fixture dependency did not start.' }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $rankOcrBinary)
          } catch {
            $rankOcrFailure = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=OCR dependency setup::$rankOcrFailure"
            exit 1
          }
      - name: Frontend production check
        run: npm run build
      - name: Desktop security checks
        run: npm --prefix desktop test
      - name: Python regressions
        run: |
          python -m pytest -q --tb=short 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\rank-pytest.log"
          $rankTestExit = $LASTEXITCODE
          if ($rankTestExit -ne 0) {
            '### Windows regression failure' | Add-Content $env:GITHUB_STEP_SUMMARY
            '```text' | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content "$env:RUNNER_TEMP\rank-pytest.log" -Tail 160 | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            # Public check annotations remain readable when raw Actions logs
            # require a browser login. Only test failures are reported.
            $rankReportLines = Get-Content "$env:RUNNER_TEMP\rank-pytest.log"
            $rankFailureLines = @($rankReportLines | Where-Object { $_ -match '^FAILED |^ERROR ' } | Select-Object -First 7) + @($rankReportLines | Where-Object { $_ -match '^E\s' } | Select-Object -First 3)
            $rankFailureLines | ForEach-Object {
              $rankFailure = $_.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows regression::$rankFailure"
            }
            exit $rankTestExit
          }
      - name: Build bundled backend and NSIS exe
        run: python scripts/build_desktop.py --skip-install
      - name: Exercise actual Electron app with bundled Windows backend
        env:
          RANK_DESKTOP_BACKEND: ${{ github.workspace }}\build\desktop-backend\rank-backend\rank-backend.exe
        run: node scripts/desktop-electron-test.mjs
      - name: Install, launch, upgrade and uninstall on Windows
        run: .\scripts\test_windows_installer.ps1
      - name: Upload installer and integrity files
        uses: actions/upload-artifact@v4
        with:
          name: Rank-Studio-Windows-x64
          path: |
            release/windows/*.exe
            release/windows/*.blockmap
            release/windows/*.yml
            release/windows/SHA256SUMS.json
          if-no-files-found: error

name: Windows desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', 'backend/**', 'src/**', 'scripts/desktop*', 'scripts/build_desktop.py', 'requirements.txt', 'package*.json', '.github/workflows/windows-desktop.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RANK_PUBLISHER: ${{ vars.RANK_PUBLISHER }}
      RANK_UPDATE_URL: ${{ vars.RANK_UPDATE_URL }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt -r desktop/requirements-build.txt
          npm ci
          npm --prefix desktop ci
      - name: Verify and stage FFmpeg and Node
        run: |
          python scripts/build_desktop.py --prepare-only
          Add-Content -Path $env:GITHUB_PATH -Value "$pwd\build\desktop-tools\bin"
      - name: Frontend production check
        run: npm run build
      - name: Desktop security checks
        run: npm --prefix desktop test
      - name: Python regressions
        run: |
          python -m pytest -q --tb=short 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\rank-pytest.log"
          $rankTestExit = $LASTEXITCODE
          if ($rankTestExit -ne 0) {
            '### Windows regression failure' | Add-Content $env:GITHUB_STEP_SUMMARY
            '```text' | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content "$env:RUNNER_TEMP\rank-pytest.log" -Tail 160 | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            exit $rankTestExit
          }
      - name: Build bundled backend and NSIS exe
        run: python scripts/build_desktop.py --skip-install
      - name: Exercise actual Electron app with bundled Windows backend
        env:
          RANK_DESKTOP_BACKEND: ${{ github.workspace }}\build\desktop-backend\rank-backend\rank-backend.exe
        run: node scripts/desktop-electron-test.mjs
      - name: Install, launch, upgrade and uninstall on Windows
        run: .\scripts\test_windows_installer.ps1
      - name: Upload installer and integrity files
        uses: actions/upload-artifact@v4
        with:
          name: Rank-Studio-Windows-x64
          path: |
            release/windows/*.exe
            release/windows/*.blockmap
            release/windows/*.yml
            release/windows/SHA256SUMS.json
          if-no-files-found: error

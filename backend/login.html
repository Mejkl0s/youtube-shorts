<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111213">
  <title>Přihlášení · Rank Studio</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:#111213; color:#eef1eb; font:16px/1.5 system-ui,sans-serif; }
    main { width:100%; max-width:440px; padding:34px; border:1px solid #35422d; border-radius:18px; background:linear-gradient(145deg,#20271b,#171b16); box-shadow:0 20px 70px #0004; }
    .brand { color:#cafa63; font-weight:750; letter-spacing:-1px; font-size:26px; }
    .badge { display:inline-block; margin:22px 0 0; font-size:11px; color:#afc399; text-transform:uppercase; letter-spacing:1.2px; }
    h1 { margin:8px 0 12px; font-size:29px; line-height:1.2; letter-spacing:-.8px; }
    p { margin:0 0 24px; color:#a9b79e; font-size:14px; }
    label { display:block; font-size:13px; color:#d0ddc4; margin:17px 0 7px; }
    input { width:100%; padding:13px; color:#edf3e6; background:#10170c; border:1px solid #455537; border-radius:8px; font:inherit; }
    input:focus { outline:2px solid #cafa63; outline-offset:2px; }
    button { width:100%; margin-top:24px; padding:14px; font:inherit; font-weight:700; border:0; border-radius:8px; background:#cafa63; color:#1a2113; cursor:pointer; }
    button:hover { background:#dbff8e; }
    .error { padding:12px; margin:18px 0 0; border:1px solid #824d43; border-radius:8px; background:#38201b; color:#ffbcb1; }
    .help { margin:20px 0 0; font-size:12px; color:#8d9f7f; overflow-wrap:anywhere; }
    code { color:#bed6a5; }
    @media(max-width:440px) { body { padding:16px; } main { padding:25px; } h1 { font-size:26px; } }
  </style>
</head>
<body>
  <main>
    <div class="brand">rankstudio</div>
    <span class="badge">Ranking Shorts · 5 → 1</span>
    <h1>Přihlas se do svého studia</h1>
    <p>Pět klipů, tvoje pořadí, vlastní předloha a export hotového Shortu.</p>
    @@ERROR@@
    <form action="/auth/login" method="post">
      <label for="username">Uživatelské jméno</label>
      <input id="username" name="username" value="@@USERNAME@@" autocomplete="username" maxlength="200" required>
      <label for="password">Heslo</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="512" required>
      <button type="submit">Otevřít ranking studio</button>
    </form>
    <p class="help">Použij svoje heslo studia. Nastavil jsi ho na Renderu jako <code>STUDIO_PASSWORD</code>.</p>
  </main>
</body>
</html>

<!doctype html>
<html lang="cs">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rank Studio</title>
<style>
body{margin:0;background:#0c1017;color:#e8edf5;font:14px 'Segoe UI',system-ui,sans-serif;display:grid;place-content:center;min-height:100vh}
main{width:340px;padding:34px;border:1px solid #2e3d52;border-radius:18px;background:#141b26;box-shadow:0 20px 70px #0003}
.brand{display:flex;align-items:center;gap:12px}.mark{display:flex;gap:4px;align-items:flex-end;justify-content:center;background:#a1e7c1;width:37px;height:37px;box-sizing:border-box;padding:9px;border-radius:10px}.mark i{width:4px;height:11px;background:#1c3628;border-radius:1px}.mark i:nth-child(2){height:18px}.mark i:nth-child(3){height:8px}
strong{font-size:26px;letter-spacing:-1px;font-weight:650}strong span{color:#a0b2c9;font-weight:400}
p{color:#a0b2c9;font-size:13px;line-height:1.7;margin:27px 0 18px}progress{accent-color:#a1e7c1;width:100%;height:5px;border:0;border-radius:3px;overflow:hidden}small{display:block;color:#728ba8;font-size:11px;margin-top:17px}
</style>
<main><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><strong>rank<span>studio</span></strong></div><p>Spouštím editor a místní nástroje…</p><progress aria-label="Spouštění aplikace"></progress><small>Za chvíli můžeš pokračovat ve svém projektu.</small></main>
</html>
